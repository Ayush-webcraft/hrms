name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: PHP Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: php-cs-fixer

      - name: Check syntax (all PHP files)
        run: find . -name "*.php" -not -path "./vendor/*" | xargs -P4 -I{} php -l {}

  test-sqlite:
    name: Migrate & Smoke-test (SQLite)
    runs-on: ubuntu-latest
    needs: lint
    env:
      DB_DRIVER: sqlite
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo, pdo_sqlite

      - name: Run migrations + seed
        run: php database/migrate.php

      - name: Verify tables exist
        run: |
          php -r "
            require 'app/bootstrap.php';
            \$tables = ['users','employees','attendance','leaves','salaries'];
            foreach (\$tables as \$t) {
              \$row = Database::first(\"SELECT name FROM sqlite_master WHERE type='table' AND name=?\", [\$t]);
              if (!\$row) { echo \"MISSING: \$t\n\"; exit(1); }
              echo \"OK: \$t\n\";
            }
          "

      - name: Verify demo data seeded
        run: |
          php -r "
            require 'app/bootstrap.php';
            \$c = Database::first('SELECT COUNT(*) AS c FROM employees');
            if ((int)\$c['c'] < 1) { echo 'No employees seeded\n'; exit(1); }
            echo 'Employees seeded: ' . \$c['c'] . \"\n\";
          "

  test-mysql:
    name: Migrate & Smoke-test (MySQL)
    runs-on: ubuntu-latest
    needs: lint
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: hrms_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DB_DRIVER: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: hrms_db
      DB_USERNAME: root
      DB_PASSWORD: secret
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo, pdo_mysql

      - name: Run migrations + seed
        run: php database/migrate.php

      - name: Verify demo data seeded
        run: |
          php -r "
            require 'app/bootstrap.php';
            \$c = Database::first('SELECT COUNT(*) AS c FROM employees');
            if ((int)\$c['c'] < 1) { echo 'No employees seeded\n'; exit(1); }
            echo 'Employees seeded: ' . \$c['c'] . \"\n\";
          "
